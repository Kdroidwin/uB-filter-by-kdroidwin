name: Sync selected files from Codeberg

on:
  repository_dispatch:
    types: [codeberg_sync]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4

      - name: Clone Codeberg repo
        run: |
          git clone https://codeberg.org/Kdroidwin/uB-filter-by-kdroidwin codeberg

      - name: Sync only filter files
        run: |
          cp codeberg/uBlockorigin.txt ./uBlockorigin.txt
          cp codeberg/uBlacklist.txt ./uBlacklist.txt
          cp codeberg/uBlacklist2.txt ./uBlacklist2.txt
          cp codeberg/uBlacklist-Exclusion.txt ./uBlacklist-Exclusion.txt

      - name: Commit & push changes
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

          git add .
          git commit -m "sync filter files from Codeberg" || exit 0
          git push
